services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simops
      POSTGRES_PASSWORD: simops
      POSTGRES_DB: simops
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - simops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://simops:simops@postgres:5432/simops?schema=public
      REDIS_URL: redis://redis:6379
      SIMULATOR_URL: http://simulator:4100
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://simops:simops@postgres:5432/simops?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_started

  simulator:
    build:
      context: .
      target: simulator
    environment:
      SIMOPS_API_URL: http://api:4000
      SIMULATOR_PORT: 4100
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  simops_pg:
